<div class="calculadora">

  <h1>🧮 Calculadora</h1>

  <div class="campo">
    <label>Número 1</label>
    <input type="number" [(ngModel)]="numero1">
  </div>

  <div class="campo">
    <label>Operador</label>
    <select [(ngModel)]="operador">
      <option value="+">+</option>
      <option value="-">−</option>
      <option value="*">×</option>
      <option value="/">÷</option>
    </select>
  </div>

  <div class="campo">
    <label>Número 2</label>
    <input type="number" [(ngModel)]="numero2">
  </div>

  <button (click)="operar()">OPERAR</button>

  <div class="resultado">
    <label>Resultado</label>
    <input type="text" [value]="resultado" readonly>
  </div>

  <div class="historial">
    <h2>Historial</h2>

    <p *ngIf="historial.length === 0">
      No hay operaciones todavía.
    </p>

    <div *ngFor="let operacion of historial">
      {{ operacion }}
    </div>
  </div>

</div>
